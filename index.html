<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Team Task Status Dashboard</title>
<style>
  :root{
    --bg:#f4f6fb; --card:#ffffff; --primary:#4f46e5;
    --green:#16a34a; --amber:#d97706; --red:#dc2626; --blue:#2563eb;
    --text:#1f2937; --muted:#6b7280; --border:#e5e7eb; --sidebar:#111827;
  }
  *{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',Arial,sans-serif}
  body{background:var(--bg);color:var(--text)}
  .layout{display:flex;min-height:100vh}

  .sidebar{width:230px;background:var(--sidebar);color:#e5e7eb;padding:20px 14px;
           position:fixed;top:0;bottom:0;left:0;transition:transform .3s;z-index:100}
  .sidebar h2{font-size:18px;margin-bottom:24px;color:#fff;display:flex;align-items:center;gap:8px}
  .sidebar a{display:flex;align-items:center;gap:10px;padding:11px 12px;border-radius:8px;
             color:#9ca3af;text-decoration:none;margin-bottom:6px;font-size:14px}
  .sidebar a:hover,.sidebar a.active{background:rgba(255,255,255,.08);color:#fff}
  .menu-btn{display:none;position:fixed;top:14px;left:14px;z-index:200;background:var(--primary);
            color:#fff;border:none;border-radius:8px;padding:9px 13px;font-size:16px;cursor:pointer}

  .main{margin-left:230px;flex:1;padding:24px;transition:margin .3s}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px;flex-wrap:wrap;gap:12px}
  .topbar h1{font-size:22px}
  .search{padding:9px 14px;border:1px solid var(--border);border-radius:8px;width:250px;max-width:100%}

  /* Filter bar */
  .filter-bar{display:flex;gap:12px;flex-wrap:wrap;align-items:flex-end;margin-bottom:22px;
              background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
  .fgroup{display:flex;flex-direction:column;gap:5px;min-width:160px;flex:1}
  .fgroup label{font-size:12px;font-weight:600;color:var(--muted);text-transform:uppercase;letter-spacing:.5px}
  .fgroup select{padding:9px 12px;border:1px solid var(--border);border-radius:8px;font-size:13px;
                 background:#fff;color:var(--text);cursor:pointer;width:100%}
  .fgroup select:focus{outline:none;border-color:var(--primary);box-shadow:0 0 0 3px #e0e7ff}
  .reset-btn{padding:9px 20px;border:none;border-radius:8px;background:var(--primary);color:#fff;
             font-size:13px;font-weight:600;cursor:pointer}
  .reset-btn:hover{background:#4338ca}

  .person-cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-bottom:22px}
  .pcard{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:16px 18px}
  .pcard h4{font-size:15px;margin-bottom:4px}
  .pcard .role{font-size:12px;color:var(--muted);margin-bottom:12px}
  .pcard .counts{display:flex;gap:6px;flex-wrap:wrap}
  .pcard .cnt{font-size:11px;padding:4px 10px;border-radius:14px;font-weight:700}
  .c-done{background:#dcfce7;color:var(--green)} .c-prog{background:#dbeafe;color:var(--blue)}
  .c-pend{background:#fef3c7;color:var(--amber)} .c-stop{background:#fee2e2;color:var(--red)}

  .panel{background:var(--card);border:1px solid var(--border);border-radius:12px;padding:18px}
  .panel h3{font-size:15px;margin-bottom:16px}
  .table-head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:10px;margin-bottom:12px}
  .table-head h3{margin-bottom:0}
  .total-badge{font-size:12px;background:#eef2ff;color:var(--primary);padding:4px 12px;border-radius:14px;font-weight:700}
  .no-result{text-align:center;padding:40px;color:var(--muted)}

  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:10px 12px;border-bottom:1px solid var(--border);vertical-align:top}
  th{color:var(--muted);font-weight:600;background:#fafafa;position:sticky;top:0}
  tr:hover td{background:#f9fafb}
  .person-tag{display:inline-block;font-size:11px;padding:3px 10px;border-radius:14px;font-weight:700;color:#fff;white-space:nowrap}
  .p-mathew{background:#0ea5e9}.p-koventhan{background:#8b5cf6}.p-karthi{background:#f59e0b}.p-sarojini{background:#ec4899}
  .status{padding:4px 10px;border-radius:14px;font-size:11px;font-weight:700;white-space:nowrap;display:inline-block}
  .s-done{background:#dcfce7;color:var(--green)} .s-prog{background:#dbeafe;color:var(--blue)}
  .s-pend{background:#fef3c7;color:var(--amber)} .s-stop{background:#fee2e2;color:var(--red)}
  .tbl-wrap{overflow-x:auto;max-height:560px;overflow-y:auto}

  @media(max-width:768px){
    .menu-btn{display:block}
    .sidebar{transform:translateX(-100%)}
    .sidebar.open{transform:translateX(0)}
    .main{margin-left:0;padding:70px 14px 20px}
    .search{width:100%}
    .topbar{flex-direction:column;align-items:stretch}
    .fgroup{min-width:100%}
  }
</style>
<base target="_blank">
</head>
<body>
<button class="menu-btn" onclick="document.querySelector('.sidebar').classList.toggle('open')">☰</button>
<div class="layout">
  <nav class="sidebar">
    <h2>📊 Team Dashboard</h2>
    <a href="#" class="active">🏠 Overview</a>
    <a href="#tasks">✅ Task Status</a>
    <a href="#people">👥 By Person</a>
    <a href="#">📈 Reports</a>
  </nav>

  <main class="main">
    <div class="topbar">
      <h1>Task List Status — Every Individual</h1>
      <input class="search" placeholder="🔍 Search anything..." onkeyup="applyFilters()">
    </div>

    <!-- FILTER BAR -->
    <div class="filter-bar">
      <div class="fgroup">
        <label>👤 Filter by Name</label>
        <select id="fName" onchange="applyFilters()">
          <option value="All">All People</option>
          <option>Mathew</option><option>Koventhan</option>
          <option>Karthi</option><option>Sarojini</option>
        </select>
      </div>
      <div class="fgroup">
        <label>🚦 Filter by Status</label>
        <select id="fStatus" onchange="applyFilters()">
          <option value="All">All Statuses</option>
          <option>Completed</option><option>In Progress</option>
          <option>Pending</option><option>Not Started</option>
          <option>Project Stopped</option>
        </select>
      </div>
      <div class="fgroup">
        <label>📅 Filter by Timeline</label>
        <select id="fTimeline" onchange="applyFilters()">
          <option value="All">All Timelines</option>
          <option value="oct1">Oct 1–8 (Week 1)</option>
          <option value="oct9">Oct 9–17 (Week 2–3)</option>
          <option value="oct18">Oct 18–20 (Week 3)</option>
          <option value="oct21">Oct 21–27 (Week 4)</option>
          <option value="daily">Daily / Ongoing</option>
          <option value="day">Short tasks (1–2 Days)</option>
        </select>
      </div>
      <button class="reset-btn" onclick="resetFilters()">↺ Reset</button>
    </div>

    <!-- Person summary cards -->
    <section class="person-cards" id="people"></section>

    <!-- Full task table -->
    <section class="panel" id="tasks">
      <div class="table-head">
        <h3>Complete Task List</h3>
        <span class="total-badge" id="totalBadge"></span>
      </div>
      <div class="tbl-wrap">
      <table>
        <thead><tr>
          <th>Person</th><th>Task / Module</th><th>Category</th><th>Timeline</th><th>Status</th>
        </tr></thead>
        <tbody id="tbody"></tbody>
      </table>
      <div class="no-result" id="noResult" style="display:none">😕 No tasks match your filters</div>
      </div>
    </section>
  </main>
</div>

const PEOPLE = ["Mathew","Koventhan","Karthi","Sarojini"];
const ROLES = {Mathew:"IT & Security",Koventhan:"CRM Development",Karthi:"BDE / Automation",Sarojini:"Task Management"};
const ST_CLASS = {"Completed":"s-done","In Progress":"s-prog","Pending":"s-pend","Not Started":"s-pend","Project Stopped":"s-stop"};

function getFilters(){
  return {
    name: document.getElementById('fName').value,
    status: document.getElementById('fStatus').value,
    tl: document.getElementById('fTimeline').value,
    q: document.querySelector('.search').value.toLowerCase()
  };
}

function applyFilters(){
  const f = getFilters();
  const rows = TASKS.filter(t =>
    (f.name==='All'||t.person===f.name) &&
    (f.status==='All'||t.status===f.status) &&
    (f.tl==='All'||t.tl===f.tl) &&
    (!f.q || t.task.toLowerCase().includes(f.q)||t.person.toLowerCase().includes(f.q)||
     t.status.toLowerCase().includes(f.q)||t.cat.toLowerCase().includes(f.q)||t.time.toLowerCase().includes(f.q)));

  document.getElementById('tbody').innerHTML = rows.map(t=>`<tr>
    <td><span class="person-tag p-${t.person.toLowerCase()}">${t.person}</span></td>
    <td><b>${t.task}</b><br><span style="color:var(--muted);font-size:11px">${t.cat}</span></td>
    <td>${t.cat}</td>
    <td style="white-space:nowrap">${t.time}</td>
    <td><span class="status ${ST_CLASS[t.status]}">${t.status}</span></td>
  </tr>`).join('');
  document.getElementById('totalBadge').textContent = rows.length + ' task' + (rows.length!==1?'s':'');
  document.getElementById('noResult').style.display = rows.length ? 'none' : 'block';

  // Summary cards follow the active name/status filter
  renderCards(rows);
}

function renderCards(rows){
  const wrap=document.getElementById('people');
  wrap.innerHTML='';
  PEOPLE.forEach(p=>{
    const mine=rows.filter(t=>t.person===p);
    if(!mine.length) return;
    const done=mine.filter(t=>t.status==='Completed').length;
    const prog=mine.filter(t=>t.status==='In Progress').length;
    const pend=mine.filter(t=>t.status==='Pending'||t.status==='Not Started').length;
    const stop=mine.filter(t=>t.status==='Project Stopped').length;
    wrap.innerHTML+=`<div class="pcard">
      <h4>${p}</h4><div class="role">${ROLES[p]} · ${mine.length} task${mine.length!==1?'s':''}</div>
      <div class="counts">
        <span class="cnt c-done">✔ ${done} Done</span>
        <span class="cnt c-prog">▶ ${prog} Progress</span>
        <span class="cnt c-pend">◌ ${pend} Pending</span>
        ${stop?`<span class="cnt c-stop">✖ ${stop} Stopped</span>`:''}
      </div></div>`;
  });
}

function resetFilters(){
  document.getElementById('fName').value='All';
  document.getElementById('fStatus').value='All';
  document.getElementById('fTimeline').value='All';
  document.querySelector('.search').value='';
  applyFilters();
}

applyFilters();
document.querySelectorAll('.sidebar a').forEach(a=>
  a.addEventListener('click',()=>document.querySelector('.sidebar').classList.remove('open')));
</script>
</body>
</html>
